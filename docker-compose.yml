services:
  backend:
    build:
      context: ./backend
    container_name: vietnam-forecast-backend
    environment:
      FRONTEND_ORIGIN: http://localhost:8080
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: vietnam-forecast-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
